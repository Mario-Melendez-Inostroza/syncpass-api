spring:
  application:
    name: cursos
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mi_base_datos}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Transform DATABASE_URL if it doesn't start with jdbc:
  # This is handled by spring.properties.prepend if needed, but let's be explicit

aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:us-east-1_xxxxxxxxx}
    client-id: ${AWS_COGNITO_CLIENT_ID:xxxxxxxxxxxxxxxxxxxxxxxxxx}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}

# Configuración CORS
# Habilitar/deshabilitar CORS completamente (útil para deshabilitar cuando pasa por API Gateway)
app:
  cors:
    enabled: ${CORS_ENABLED:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,Content-Type}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}