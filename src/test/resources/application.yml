spring:
  application:
    name: cursos
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Las pruebas usan H2 con el esquema generado desde las entidades (create-drop), no el SQL de
  # Flyway, que es específico de PostgreSQL.
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Solo para que exista el bean JwtDecoder. NimbusJwtDecoder descarga las claves de forma
          # perezosa: un token mal formado se rechaza antes de pedirlas, así que no hay red.
          jwk-set-uri: http://localhost:0/jwks-de-prueba

aws:
  cognito:
    region: us-east-1
    user-pool-id: us-east-1_test
    client-id: test-client-id
    client-secret: test-secret
